999Z" fill="currentColor"/> <path d="M150.09 19.17L142.04 3.59999C142.04 5.41999 142.11 8.21999 142.11 10.05V19.17H138.75V0H143.49L151.47 14.86V0H154.83V19.17H150.09Z" fill="currentColor"/> <path d="M161.98 19.17C160.45 19.17 159.16 17.95 159.16 16.35V2.83C159.16 1.22 160.45 0.0100098 161.98 0.0100098H172.92C174.45 0.0100098 175.74 1.23 175.74 2.83V6.26001H172.38V3.46001C172.38 3.22001 172.19 3.02 171.94 3.02H162.94C162.7 3.02 162.5 3.21001 162.5 3.46001V15.72C162.5 15.96 162.7 16.16 162.94 16.16H171.94C172.18 16.16 172.38 15.96 172.38 15.72V10.98H167.52V7.96001H175.74V16.35C175.74 17.95 174.45 19.17 172.92 19.17H161.98Z" fill="currentColor"/> <path d="M62.88 41.6198V48.1898H59.52V29.0198H71.12C72.65 29.0198 73.94 30.2398 73.94 31.8398V38.7998C73.94 40.4098 72.65 41.6198 71.12 41.6198H62.88ZM70.59 32.4798C70.59 32.2398 70.4 32.0398 70.15 32.0398H62.88V38.6098H70.15C70.39 38.6098 70.59 38.4098 70.59 38.1698V32.4798Z" fill="currentColor"/> <path d="M90.25 48.1898V39.6798H81.34V48.1898H77.99V29.0198H81.34V36.6598H90.25V29.0198H93.6V48.1898H90.25Z" fill="currentColor"/> <path d="M111.36 48.1898L109.73 43.6898H101.83L100.2 48.1898H96.5801L103.97 29.0198H107.62L115.01 48.1898H111.36ZM107.2 36.6398C106.88 35.7898 106.15 33.8898 105.79 32.7498C105.4 33.8898 104.7 35.7898 104.38 36.6398L102.92 40.6798H108.66L107.2 36.6398Z" fill="currentColor"/> <path d="M129.75 48.1898L125.79 40.4298H121.34V48.1898H117.98V29.0198H129.58C131.11 29.0198 132.4 30.2398 132.4 31.8398V37.5998C132.4 39.2098 131.11 40.4198 129.58 40.4198H129.51L133.55 48.1798H129.76L129.75 48.1898ZM129.04 32.4798C129.04 32.2398 128.85 32.0398 128.6 32.0398H121.33V37.4198H128.6C128.84 37.4198 129.04 37.2298 129.04 36.9798V32.4798Z" fill="currentColor"/> <path d="M152.88 48.1898V39.0698C152.88 37.3398 152.95 34.3498 152.95 32.6198L148.62 48.1898H144.14L139.81 32.6198C139.81 34.4398 139.88 37.2398 139.88 39.0698V48.1898H136.52V29.0198H141.87L145.25 41.3298C145.52 42.2998 145.93 43.9298 146.37 45.5098C146.81 43.9298 147.22 42.2798 147.49 41.3298L150.87 29.0198H156.22V48.1898H152.86H152.88Z" fill="currentColor"/> </svg><h1>열람 기한이 종료되었습니다</h1><p>이 자료는 <b>2026-11-16</b>까지 열람할 수 있었습니다. 다시 보시려면 호랑팜에 문의해 주세요.</p><p class="foot">ⓒ 호랑팜</p></div></body></html>
          HTML
              git config user.name "hrp-expire"; git config user.email "noreply@horangpharm.co.kr"
              git commit -am "expire: 열람 기한 종료" && git push
            else
              echo "already expired ($today)"
            fi
          else
            echo "not yet ($today)"
          fi
      - name: 기한 지났으면 저장소 비공개 전환
        id: private
        # 파기 push가 실패해도 비공개 전환은 한다(보안 우선). 이미 비공개면 같은 명령이 그대로 통과한다.
        if: ${{ !cancelled() && steps.expire.outputs.expired == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.HRP_ADMIN_TOKEN }}
        run: gh repo edit "$GITHUB_REPOSITORY" --visibility private --accept-visibility-change-consequences
      - name: 비공개 전환 뒤 이 작업 끄기
        # 전환이 성공했을 때만 끈다. 실패하면 켜 둬서 다음 날 다시 시도한다.
        # 관리자 토큰이 아닌 레포 자체 토큰(actions: write)으로 끈다 — 11-10 테스트에서 HRP_ADMIN_TOKEN으로는 실패.
        if: ${{ !cancelled() && steps.private.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable expire.yml -R "$GITHUB_REPOSITORY"

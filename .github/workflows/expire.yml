# hrp-brief 열람 기한 작업 — 정본 템플릿(위키 analyses/exports/hrp-brief-expire.yml)
# 빌드 스크립트가 2026-11-16 를 열람 기한(YYYY-MM-DD, KST)으로 바꿔 .github/workflows/expire.yml 로 넣는다.
name: expire
on:
  schedule:
    - cron: '0 15 * * *'   # 매일 00:00 KST
  workflow_dispatch:
permissions:
  contents: write
  actions: write   # 비공개 전환 뒤 이 작업 끄기용
jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 기한(2026-11-16 KST) 지났으면 본문 파기
        id: expire
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          if [ "$today" \> "2026-11-16" ]; then
            echo "expired=true" >> "$GITHUB_OUTPUT"
            if grep -q 'const P=' index.html; then
              cat > index.html <<'HTML'
          <!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>열람 기한 종료</title>
                    <style>:root{--foreground:#292520;--card:#FFFFFF;--muted-foreground:#736D63;--border:#E7E3DC;--canvas:#FAF9F7;--radius:0.625rem;color-scheme:light}
          *{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--canvas);color:var(--foreground)}
          body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.5;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
          .card{width:100%;max-width:24rem;background:var(--card);border-radius:calc(var(--radius)*1.4);box-shadow:0 0 0 1px color-mix(in oklab,var(--foreground) 10%,transparent);padding:24px;display:flex;flex-direction:column;gap:6px}
          .logo{height:24px;width:auto;align-self:flex-start;color:var(--foreground);margin-bottom:12px}
          h1{font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.3}p{color:var(--muted-foreground)}p b{font-weight:600;color:var(--foreground)}
          .foot{border-top:1px solid var(--border);margin-top:14px;padding-top:14px;font-size:12px}</style></head>
